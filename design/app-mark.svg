<?xml version="1.0" encoding="UTF-8"?>
<!--
  应用标识（无底板版 / app mark）—— 2026-10-18 R 轮起生效。界面三处（侧栏品牌位、认证页企业名条、
  BrandLogo 组件）用的都是这一版；Dock/Finder/安装包用的完整底板版在 design/app-icon.svg。

  与完整底板版的关系：**闪电几何逐字相同**（同一批坐标、同一条 boltGrad），只做了两件事：
    ① 撤掉深色圆角底板、网格纹理、环境光晕、边缘高光与两圈辅助环 —— 28px 下这些细节全部糊成噪点，
       而底板会在浅色主题里变成一块与主题无关的深色方块；
    ② viewBox 从 0 0 1024 1024 裁到 140 132 760 760（以闪电包围盒中心 520,512 居中的方框），
       主体高度占比从 65% 提到 87%，小尺寸下才撑得开。

  五枚尖上的白色节点**两版都已撤掉**（2026-10-18 R 轮三批，交付方看了真机截图点名去掉）。
  这一版历史上曾把节点半径 16 → 26 并加 #047857 描边（纯白节点在浅色主题上会消失、16 的半径在
  28px 下只剩 0.6px），那条改法连同节点一起作废 —— 浅色主题读成"环"、暗档读成"白点"的分歧随之消失。
  现在两版都只剩闪电本体 + 内部走线，`brand-assets.test.ts` 里有反向断言钉住"不得再出现 circle"。

  这份是真源。运行时副本 src/assets/brand/logo.svg 只放下面这个 <svg> 元素，**注释与 XML 声明一条都不带**：
  1,319 B 的文件低于 vite 的 4096 B 内联阈值，会整份按 UTF-8 编进 main chunk 的 data URI
  （2026-10-18 实测：1,319 B 源 → 产物里 1,527 B；带三处行内注释时是 1,400 B → 1,620 B）。
  改这里记得重生成运行时副本，两者不一致时 src/assets/brand/brand-assets.test.ts 会红。
-->
<svg id="app-mark" viewBox="140 132 760 760" width="760" height="760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGrad" x1="512" y1="200" x2="512" y2="824" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7b7" />
      <stop offset="0.5" stop-color="#10b981" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#ffffff" flood-opacity="0.3" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>
  <path d="M 560 180 L 340 560 L 490 560 L 400 844 L 700 440 L 540 440 Z"
        fill="url(#boltGrad)"
        filter="url(#innerGlow)" />
  <path d="M 560 180 L 540 440 M 340 560 L 490 560 M 400 844 L 700 440"
        stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-linecap="round" />
</svg>
