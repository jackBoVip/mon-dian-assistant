<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>蒙电信产助手 · 填充状态</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      width: 300px;
      font: 13px/1.6 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #111827;
      background: #ffffff;
    }
    header {
      padding: 12px 14px 8px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #e5e7eb;
    }
    main { padding: 12px 14px; }
    .status {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f3f4f6;
      margin-bottom: 10px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      margin-top: 5px; flex: none;
      background: #9ca3af;
    }
    .status.ready .dot { background: #16a34a; }
    .status.locked .dot { background: #d97706; }
    .status.off .dot { background: #dc2626; }
    .status-text { font-weight: 600; }
    .status-note { color: #4b5563; margin-top: 2px; word-break: break-all; }
    #recheck {
      width: 100%;
      padding: 8px 0;
      border: 1px solid #2563eb;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #recheck:disabled { opacity: .6; cursor: default; }
    #recheck:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
    .hint {
      margin-top: 12px;
      color: #4b5563;
      font-size: 12px;
    }
    code {
      background: #f3f4f6;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 11px;
      word-break: break-all;
    }
    footer {
      padding: 8px 14px;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>蒙电信产助手 · 安全填充</header>
  <main>
    <div id="status" class="status off" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <div id="statusText" class="status-text">正在检测…</div>
        <div id="statusNote" class="status-note"></div>
      </div>
    </div>
    <button id="recheck" type="button">重新检测</button>
    <p class="hint">
      首次使用：请先加载本扩展，再把下方扩展 ID 填入桌面应用的
      「系统管理 → 浏览器扩展」页面，由桌面应用生成宿主清单并安装。
    </p>
    <p class="hint">本扩展 ID：<code id="extId"></code></p>
  </main>
  <footer>凭据仅一次性下发：不落盘、不缓存、不自动提交。</footer>
  <script src="popup.js"></script>
</body>
</html>
