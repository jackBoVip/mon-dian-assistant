name: verify

# 最小门禁：三道门 + Rust 测试。
# 2026-10-26 修正：此前从未真正绿过——npm 10 校验不了本仓锁文件，
# 且 src/lib/ipcContract.test.ts 的 F33 守卫在缺侧车时会红。
# 与 release.yml 保持同一套前置，避免"发版绿、日常门禁红"的双口径。
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 开发机 npm 11.6.2 能过同一份锁；Node 22 的 npm 10 会因
          # @tailwindcss/oxide-wasm32-wasi 那组 bundled 可选依赖报 EUSAGE。
          node-version: '24'
          cache: npm

      - name: 钉住 npm 与开发机一致
        run: |
          npm install -g npm@11.6.2
          node -v
          npm -v

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建本 triple 的 Native Messaging 侧车（必须先于前端门禁）
        # src/lib/ipcContract.test.ts 的 F33 守卫要求 binaries/ 里已有带 target triple
        # 的宿主，否则 `npm run verify` 就红。本机因为早有侧车而看不出来。
        shell: bash
        run: bash scripts/prepare-host-binary.sh

      - run: npm ci
      - name: 类型 + 构建 + 单测（含样式对账与静态契约）
        run: npm run verify

  backend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo test（SQLCipher 由 pkg-config 提供）
        working-directory: src-tauri
        run: cargo test --all-targets
