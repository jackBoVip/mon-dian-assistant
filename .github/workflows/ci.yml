name: verify

# 本轮（代码质量审查 F21）补的最小门禁：三道门 + Rust 测试。
# 本机仓库目前不是 git 仓库，所以这个文件今天不会执行；接上远程后它是唯一
# 能让「398 条全绿但 list_roles 每次都失败」这类事重新出现不了的东西。
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型 + 构建 + 单测（含样式对账与静态契约）
        run: npm run verify

  backend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo test（SQLCipher 由 pkg-config 提供）
        working-directory: src-tauri
        run: cargo test --all-targets
