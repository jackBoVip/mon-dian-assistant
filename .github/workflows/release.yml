name: release-packages

# 三端安装包产出矩阵（代码质量审计 2026-10-26 §三端支持）。
# 每个 job 在对应 OS 的原生 runner 上：先 prepare-host-binary.sh 产出
# externalBin 需要的 mda_fill_host-<host-triple> 侧车，再 tauri build。
# 不做交叉编译 —— 侧车与主程序都在本机 triple 上构建。
# 触发：打 v* tag 或手动 dispatch。产物两处可见：Run 的 Artifacts（90 天过期），
# 以及 publish job 自动开/更新的 GitHub Release（仓库侧栏 Releases 里那个）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 自带的 npm 10 校验不了本锁文件里 @tailwindcss/oxide-wasm32-wasi
          # 那组 bundled 可选依赖（`npm ci` 报 Missing @emnapi/core/runtime），
          # 而开发机的 npm 11.6.2 对同一份锁直接通过。所以钉死到与开发机一致的
          # npm，不去重生成锁（重生会带进一批 transitive 版本漂移，赔上样式对账守卫）。
          node-version: '24'
          cache: npm

      - name: 钉住 npm 与开发机一致
        run: |
          npm install -g npm@11.6.2
          node -v
          npm -v

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 缓存 OCR 模型
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/ocr/ppocrv5
          key: ocr-models-${{ runner.os }}-${{ hashFiles('scripts/prepare-ocr-models.mjs') }}

      - name: OCR 模型（答题助手，缺了就别打包）
        # bundle.resources 把 resources/ocr/ 映射成包内 ocr/。模型不入库（21MB），
        # 所以每个 runner 都要先按脚本里钉死的 commit + SHA-256 取一次；
        # 缓存键跟着脚本走，脚本里换了版本号自然失效。
        # 这里必须**阻塞**：模型缺了，装机包里的答题助手就是不可用状态，
        # 而 cargo test 并不认识 OCR，整轮依旧会绿——只能靠这一步拦住。
        # 缓存可能是旧的/残缺的，所以取完还要再跑一次离线校验。
        shell: bash
        run: |
          node scripts/prepare-ocr-models.mjs
          node scripts/prepare-ocr-models.mjs --check

      - name: Windows 构建前置（perl 与 nasm）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # rusqlite 的 bundled-sqlcipher-vendored-openssl 要在本机编 OpenSSL，
          # 而 GitHub Windows runner 的 PATH 上 git-bash 的 MSYS perl 排在前面，
          # 那份 perl 缺 Params::Check / IPC::Cmd 等核心模块，Configure 直接崩
          # （三端首跑实撞：`BEGIN failed--compilation aborted at .../core_perl/...`）。
          # 把 Strawberry perl 提到 PATH 最前，让 vendored 构建用它。
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          # 只探测能力，别在这里打花哨的输出：上一版把 `print qq{...}\;` 写进
          # pwsh 的双引号串里，反斜杠被 PowerShell 吃掉后 perl 自己语法错，
          # 整个 job 挂在这一步（Windows 第六轮实撞）。真正决定用哪份 perl 的是
          # 下一步在 bash 内前置 PATH，这里只保证 Strawberry 那份模块齐、能跑。
          & "C:\Strawberry\perl\bin\perl.exe" -MLocale::Maketext::Simple -MParams::Check -MIPC::Cmd -e "1"
          Write-Host "strawberry perl modules ok"
          "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Linux 打包依赖（Tauri v2 官方前置）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm \
            libpipewire-0.3-dev
          # libpipewire-0.3-dev：答题助手的截屏走 xcap，它在 Linux 上**无条件**链
          # pipewire（Wayland 取屏用），libspa-sys 的 build.rs 要 libpipewire-0.3.pc。
          # 少了它 cargo build 直接 panic（v1.0.1 首跑实测 exit 101）。

      - name: 构建本 triple 的 Native Messaging 侧车（必须先于前端门禁）
        # src/lib/ipcContract.test.ts 的 F33 守卫要求 binaries/ 里已有带 target triple
        # 的宿主，否则 `npm run verify` 就红。本机因为早有侧车而看不出来。
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # GITHUB_PATH 的前置对 git-bash 不生效：bash 会把 MSYS 自己的 /usr/bin
            # 排在最前，openssl-src 于是又取到那份缺核心模块的 perl（第五轮实撞，
            # @INC 里全是 /usr/share/perl5/core_perl）。这里在 bash 内再显式前置一次。
            export PATH="/c/Strawberry/perl/bin:$PATH"
          fi
          echo "perl in use: $(perl -e 'print $^X')"
          bash scripts/prepare-host-binary.sh

      - name: npm ci + 前端门禁（tsc / vite build / vitest）
        run: |
          npm ci
          npm run verify

      - name: cargo test（后端全量测试 · macOS/Linux）
        if: runner.os != 'Windows'
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: cargo test（后端全量测试 · Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src-tauri
        run: |
          # 第七轮实撞：测试 exe 一起来就 0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND
          # ——加载期缺导出符号，不是断言失败。这个特征码对应"二进制没有嵌入
          # Common-Controls v6 的 manifest"：静态导入的 TaskDialogIndirect 等符号
          # 只存在于 comctl32 v6，而 v6 只能靠激活上下文（manifest）加载；
          # 应用包由 bundler 带 manifest，裸测试 exe 没有，所以在 Windows 上必然崩。
          # 这里给测试链接补上清单；不通过就继续红，不静默降级成"跳过测试"。
          $mt = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK mt.exe 未找到，无法给测试 exe 嵌入 Common-Controls 清单' }
          $sdkBin = Split-Path $mt.FullName
          $env:PATH = "$sdkBin;$env:PATH"
          $manifest = Join-Path $env:RUNNER_TEMP 'comctl6.manifest'
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls"
                  version="6.0.0.0" processorArchitecture="*"
                  publicKeyToken="6595b64144ccf1df" language="*"/>
              </dependentAssembly>
            </dependency>
          </assembly>
          '@ | Set-Content -Encoding utf8 $manifest
          # 只对测试生效：release 打包那条走的是 tauri 自己的清单，别混在一起改。
          # 注意 `-C link-args=` 只吃**一个 token**：上一版写成
          # `'-C link-args=/MANIFEST:EMBED /MANIFESTINPUT:...'`，中间那个空格让
          # rustc 把 /MANIFESTINPUT 当成第二个输入文件名，直接报
          # `multiple input filenames provided`（第八轮实撞）。所以拆成两条。
          #
          # 并且必须按目标类型分开跑：tauri-build 通过 `cargo:rustc-link-arg-bins`
          # 给**每个 bin 目标**的 resource.lib 里已经嵌了一份 MANIFEST 资源，再叠
          # 一份就是 `CVTRES: fatal error CVT1100: duplicate resource
          # type:MANIFEST`（第九轮实撞，接着 LNK1123）。而 lib / integration test /
          # bench 这些目标**拿不到**那份清单——这才是第七轮
          # STATUS_ENTRYPOINT_NOT_FOUND 的来源：裸测试 exe 静态导入的
          # TaskDialogIndirect 之类符号只存在于 comctl32 v6，而 v6 只能靠 manifest
          # 的激活上下文加载。换个说法：这条平台上后端单元测试从来没跑起来过。
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS =
            '-C link-args=/MANIFEST:EMBED -C link-args=/MANIFESTINPUT:' + $manifest
          cargo test --lib --tests --benches
          Remove-Item Env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS
          cargo test --bins

      - name: build macOS（app + dmg 必须同一次调用，单跑 dmg 会删掉 .app）
        if: runner.os == 'macOS'
        run: npx tauri build --bundles app,dmg

      - name: macOS 封条自检（缺 sealed Resources 就别让坏包出厂）
        if: runner.os == 'macOS'
        run: |
          # v1.0.0 实撞（2026-10-27）：CI 的四个 job 全绿，发出去的 dmg 却打不开，报"已损坏"。
          # 根因是 bundle.macOS 段为空 → bundler 跳过签名，包里只剩链接器那层
          # `adhoc,linker-signed` 且 `Sealed Resources=none`；macOS 对 app bundle 要求有封条，
          # 缺它给出的正是那句"损坏"。所以这里把判据钉在**产物**上，不钉在步骤退出码上。
          set -euo pipefail
          app="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" || { echo "::error::bundle/macos 下没有 .app"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          # 光看退出码不够：未封条的包在 --verify 不带 --strict 时也能过。
          # 直接钉那个字段本身 —— `Sealed Resources=none` 就是这次的病征。
          dump="$(codesign -dvvv "$app" 2>&1)"
          echo "$dump" | grep -E 'Sealed Resources version=[0-9]+' \
            || { echo "::error::签名里没有 sealed Resources（=bundler 没签名，装上去会报「已损坏」）"; exit 1; }
          # dmg 是真正发出去的那一面：从镜像里再验一次，别只信构建目录
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg" || { echo "::error::bundle/dmg 下没有 .dmg"; exit 1; }
          mp="$(hdiutil attach -nobrowse -readonly "$dmg" | awk '/\/Volumes\//{print $NF}' | tail -1)"
          set +e
          codesign --verify --deep --strict "${mp}/$(basename "$app")"; rc=$?
          set -e
          hdiutil detach "$mp" -quiet
          [ "$rc" -eq 0 ] || { echo "::error::dmg 内的 app 校验不过，使用者拿到的就是打不开的那一份"; exit 1; }
          echo "封条自检通过：$app 与 dmg 内的同一份都通过 codesign --verify --deep --strict"

      - name: build Windows（nsis 与 msi 分两次调用）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 第十一轮实撞：这里写的是 bash 的 `if ! cmd; then`，而 Windows 步骤默认
          # shell 是 pwsh → ParserError，整段一行都没执行（连 nsis 都没跑）。
          # pwsh 里原生命令失败默认也不中断，所以两条都要显式看 $LASTEXITCODE。
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "nsis 打包失败（exit $LASTEXITCODE）" }
          # pwsh 会把最后一条原生命令的退出码当作脚本退出码：第十二轮里 nsis 已经
          # `Finished 1 bundle`、msi 的 ::warning:: 也照常发出了，步骤却仍 exit 1。
          # 所以先断言 nsis 的 .exe 真的在盘上（不掩盖真失败），再显式收尾。
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $nsis) { throw 'nsis 报成功但 bundle/nsis 下没有 .exe' }
          Write-Host "nsis artifact: $($nsis[0].Name) ($([math]::Round($nsis[0].Length/1MB,2)) MB)"
          # 第十轮实撞：MSI 在 WiX 链接期报 LGHT0311——产品名是中文，而生成的
          # main.wxs 用默认 codepage 1252（Latin-1）装不下。已把 wix.language
          # 设成 zh-CN 让 WiX 走 936，那条从此消失；第十一/十二轮 MSI 改为
          # ICE30：侧车 mda_fill_host.exe 被 'mda_fill_host.exe' 与 'mda_fill_host'
          # 两个组件重复登记（与 Linux rpm 那句 duplicate file entry 同源）。
          # msi 保持非阻塞：保证即使 msi 再出问题，本轮也能交付 NSIS 的 -setup.exe。
          npx tauri build --bundles msi
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::msi 打包失败（WiX ICE30：externalBin 侧车在 MSI 里被两个组件重复登记）；本轮只交付 NSIS .exe"
          }
          exit 0

      - name: build Linux（deb / rpm / appimage 各自一次调用）
        if: runner.os == 'Linux'
        run: |
          # 一次 `--bundles deb,rpm,appimage` 会把 externalBin 的侧车往同一个包里
          # 登记两次，deb 打包直接失败：`invalid destination path /usr/bin/mda_fill_host
          # - duplicate file entry; the same path was added to the package twice`
          # （第六轮实撞；同一条在 macOS 上不成立——那边 app,dmg 必须一次写全）。
          # 拆成逐目标调用，cargo 复用已编好的 release 二进制，不重复编译。
          npx tauri build --bundles deb
          if command -v rpmbuild >/dev/null 2>&1; then
            # 第七轮实测：拆开之后 deb 过了，rpm **单独调用仍报同一句 duplicate**，
            # 所以这不是调用方式问题，是 Tauri 的 rpm 打包对 externalBin 的登记缺陷。
            # 让 rpm 失败不阻塞整轮（deb + AppImage 是可用交付），但显式报警，
            # 不把"rpm 没产出"粉饰成"rpm 通过"。
            if ! npx tauri build --bundles rpm; then
              echo "::warning::rpm 打包失败（externalBin 在 rpm 里被重复登记，Tauri 侧缺陷）；本轮只交付 deb + AppImage"
            fi
          else
            echo "::warning::runner 无 rpmbuild，本轮跳过 rpm"
          fi
          npx tauri build --bundles appimage

      - name: Linux deb 包名收口（Debian Policy §5.6.6）
        if: runner.os == 'Linux'
        run: |
          # 拆包实测：Tauri 生成的 control 是 `Package: 蒙电信产助手`——它直接拿
          # productName 当包名，而 DebConfig 没有包名覆写键。Policy §5.6.6 要求
          # 包名为小写 ASCII；apt/dpkg 对这种包名的处置由真机定论，这里先让
          # dpkg 自己的校验器把判定留在日志里（不以 macOS 上的推断代替证据）。
          # `--validate-pkgname` 自 dpkg 1.18.16 起存在；`--validate-thing` 在
          # Ubuntu 22.04 的 dpkg 1.21 里没有，别用。
          echo "dpkg 对中文包名的判定："
          rc=0; dpkg --validate-pkgname '蒙电信产助手' || rc=$?
          echo "  → exit=$rc（0 合法 / 1 仅 lax / 2 非法）"
          # 只重写 control 的 Package 与 deb 文件名；包内可执行文件、桌面入口
          # 的显示名（蒙电信产助手.desktop / Name=蒙电信产助手）保持不变。
          bash scripts/fix-deb-package-name.sh src-tauri/target/release/bundle/deb
          dpkg-deb -f src-tauri/target/release/bundle/deb/*.deb Package

      - name: OCR 模型确实进了安装包（看产物，不看步骤退出码）
        # 判据钉在**交付物**上：这一步之前所有打包命令都只是"退出码为 0"，
        # 而资源没被 bundler 收进去时退出码同样为 0，装上机才知道助手不可用。
        # Windows 的 NSIS .exe 与 Linux 的 AppImage 是压缩容器，本 job 不解包；
        # 它们靠上一步 `--check`（同一份 build 输入）与这里 macOS/deb 的同源证明兜住。
        if: runner.os == 'macOS' || runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          check() {
            # $1 = 展示名，$2 = 列出文件的命令（每行一个路径）
            for want in ocr/ppocrv5/det/inference.onnx ocr/ppocrv5/rec/inference.onnx; do
              if ! eval "$2" | grep -qF "$want"; then
                echo "::error::$1 里没有 $want —— 答题助手会以「模型缺失」状态出厂"
                return 1
              fi
            done
            echo "  ✓ $1 内含 det/rec 两个模型"
          }
          if [ "${RUNNER_OS}" = "macOS" ]; then
            app="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app" || { echo "::error::没有 .app 可查"; exit 1; }
            check "$app" "find '$app/Contents/Resources' -type f -print"
          else
            deb="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
            test -n "$deb" || { echo "::error::没有 .deb 可查"; exit 1; }
            check "$deb" "dpkg-deb -c '$deb' | awk '{print \$6}'"
          fi

      - name: 生成 SHA-256 摘要清单
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          # macOS 没有 sha256sum（只有 shasum -a 256），BSD xargs 也不认 -r，
          # 第五轮 macOS 就是死在 `xargs: sha256sum: No such file or directory`。
          # 统一成一条跨平台写法：按可用性选校验命令，逐行读 -print0。
          : > ../artifacts-sha256.txt
          while IFS= read -r -d '' f; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f"
            else
              shasum -a 256 "$f"
            fi
          done < <(find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
                                   -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0) \
            >> ../artifacts-sha256.txt
          test -s ../artifacts-sha256.txt || { echo "::error::摘要清单为空，产物没打出来"; exit 1; }
          cat ../artifacts-sha256.txt

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}-${{ github.ref_name || github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/artifacts-sha256.txt
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release（安装包挂到仓库的 Releases）
    # Actions 的 artifact 只在 Run 页面可见、默认 90 天后过期，仓库侧栏的
    # Releases/Packages 不会显示它。这一步把三端 artifact 拉平、改成 ASCII
    # 资源名，再开一个 Release 把安装包附上去。
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载三端 artifact
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dl

      - name: 整理成 Release 资源名并复算摘要
        run: |
          set -euo pipefail
          mkdir -p out
          for d in dl/packages-*; do
            while IFS= read -r -d '' f; do
              b="$(basename "$f")"
              case "$b" in
                *.dmg)       a="${b%.dmg}";       cp "$f" "out/macOS-${a##*_}.dmg" ;;
                # NSIS 的产物名结尾是 `_x64-setup.exe`，不是 `_setup.exe`。原先那枚
                # `*_setup.exe` 分支从没接住过（build.17 是 publish job 第一次真跑，当场露馅）：
                # 中文原名落进 out/，GitHub 上传时静默删掉非 ASCII 字符，
                # `蒙电信产助手_0.1.0_x64-setup.exe` 就成了 `_0.1.0_x64-setup.exe`，
                # 而 SHA256SUMS.txt 记的还是上传前那个名字 —— 使用者 `sha256sum -c` 必失败。
                *.exe)       cp "$f" "out/Windows-x64-setup.exe" ;;
                *.deb)       a="${b%.deb}";       cp "$f" "out/Linux-${a##*_}.deb" ;;
                *.AppImage)  a="${b%.AppImage}";  cp "$f" "out/Linux-${a##*_}.AppImage" ;;
                *)           cp "$f" "out/$b" ;;
              esac
            done < <(find "$d" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          done
          # 摘要按最终资源名重算：包内自带的清单记的是各 runner 上的 bundle 相对路径。
          ( cd out && sha256sum -- * > ../SHA256SUMS.txt )
          mv SHA256SUMS.txt out/
          test -n "$(find out -name 'macOS-*.dmg' -print -quit)" || { echo "::error::没有 macOS 包"; exit 1; }
          # 资源名必须纯 ASCII：上传那一步 GitHub 会静默删掉非 ASCII 字符（见上面 *.exe 分支那条），
          # 到那时清单里的名字就对不上了。宁可在这里就红，不要把一个 `-c` 必失败的 Release 发出去。
          if LC_ALL=C grep -q '[^ -~]' out/SHA256SUMS.txt; then
            echo "::error::SHA256SUMS.txt 里有非 ASCII 资源名 —— 改名分支没接住某个产物"
            exit 1
          fi
          ls -l out

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n1)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"; prerelease=""
          else
            # 非 tag 触发（dispatch/分支）不占正式 tag，避免与 v* 抢同一个 Release。
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"; prerelease="--prerelease"
          fi
          cat > release-notes.md <<EOF
          三端安装包由 GitHub Actions 的原生 runner 产出（commit ${GITHUB_SHA}）。

          - macOS：\`macOS-<arch>.dmg\`（未签名，ad-hoc；其它 Mac 上 Gatekeeper 会拦）
          - Windows：\`Windows-x64-setup.exe\`（NSIS；msi 未产出，WiX ICE30）
          - Linux：\`Linux-amd64.deb\` + \`Linux-amd64.AppImage\`（rpm 未产出，Tauri 侧 externalBin 重复登记）
          - \`SHA256SUMS.txt\` 按上面这些资源名计算，下载后先 \`sha256sum -c\` 再装

          交付前必读：三端**均未签名、均未在目标机做过安装与首启验证**；WebView2 走
          \`downloadBootstrapper\`，内网无外网时安装阶段会失败。详见仓库内
          \`docs/部署手册.md\` §1.2/§1.3 与《代码质量审计与三端支持》。
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* $prerelease --target "$GITHUB_SHA" \
              --title "蒙电信产助手 ${version} 三端安装包" --notes-file release-notes.md
          fi
          # 终判据是**发布出来的那一面**，不是我以为传上去的那一面：
          # 名字逐条比对（清单自身那一行不在摘要里，单独补上），对不上就让 job 红。
          { awk '{print $2}' out/SHA256SUMS.txt; echo SHA256SUMS.txt; } | sort > expected-names.txt
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > published-names.txt
          if ! diff -u expected-names.txt published-names.txt > name-diff.txt 2>&1; then
            cat name-diff.txt
            echo "::error::Release 上的资源名与 SHA256SUMS.txt 不同源，下载后 sha256sum -c 会失败"
            exit 1
          fi
          echo "资源名与摘要清单逐条同源（$(wc -l < published-names.txt | tr -d ' ') 枚）"
          echo "Release 已就绪：$tag（https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}）"


