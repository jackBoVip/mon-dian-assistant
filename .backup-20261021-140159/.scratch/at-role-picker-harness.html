<!doctype html>
<html lang="zh-CN" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AT 调整角色探针</title>
<link rel="stylesheet" href="../dist/assets/global-BewFbTIH.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(900px 600px at 15% 10%, rgba(124, 92, 255, 0.16), transparent 60%),
      radial-gradient(700px 500px at 90% 90%, rgba(56, 189, 248, 0.12), transparent 60%),
      var(--t-bg);
    color: var(--t-text);
    font-family: var(--font-sans);
  }
  /* 弹窗背后放一块台账，用来看玻璃面压住的是什么 */
  .behind { padding: 32px; display: grid; gap: 10px; max-width: 900px; }
  .behind .row { display: grid; grid-template-columns: 120px 1fr 180px 140px; gap: 12px;
    border: 1px solid var(--t-border); border-radius: var(--radius-md); background: var(--t-surface);
    padding: 12px 16px; font-size: 13px; color: var(--t-text-body); }
  /* 探针专用：生产里由 Radix 决定指示器挂不挂，这里用属性切换 */
  [role='checkbox'][data-state='unchecked'] .indicator { display: none; }
</style>
</head>
<body>
  <div class="behind" aria-hidden="true">
    <div class="row"><span>阿敏</span><span>U-2 · 数据库运维组</span><span>审计员、退休角色</span><span>2 个角色</span></div>
    <div class="row"><span>老周</span><span>U-7 · 终端运维组</span><span>审计员</span><span>1 个角色</span></div>
    <div class="row"><span>小林</span><span>U-9 · 系统管理组</span><span>系统管理员</span><span>1 个角色</span></div>
  </div>

  <div class="overlay-veil overlay-veil--center">
    <div class="overlay-dialog overlay-panel surface-elevated surface-glass" role="dialog" aria-modal="true" aria-labelledby="at-title" aria-describedby="at-desc">
      <div class="modal-head">
        <h2 class="modal-title" id="at-title">调整角色</h2>
        <div class="modal-head-actions">
          <button type="button" class="btn-ghost" aria-label="关闭">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="modal-body max-h-[70vh] overflow-y-auto">
        <div class="flex flex-col gap-3">
          <div class="flex items-center gap-3 rounded-md bg-sunken p-3">
            <span class="user-avatar role-picker-avatar" aria-hidden="true">阿</span>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-ink">阿敏</p>
              <p class="text-xs leading-[18px] text-ink-muted">
                内部标识 <span class="mono text-[11px]">U-2</span>
                <span aria-hidden="true"> · </span>
                保存后整体替换该使用者的全部角色
              </p>
            </div>
          </div>

          <div class="flex items-baseline justify-between gap-2">
            <span class="text-xs font-semibold text-ink-body">角色</span>
            <span class="text-xs leading-[18px] text-ink-muted tabular-nums" aria-live="polite" id="count">
              已选 <b class="font-semibold text-ink">1</b> / 4
            </span>
          </div>

          <div class="flex flex-col gap-2" role="group" aria-label="角色" id="roles">
            <label class="role-option flex items-start gap-2.5 px-3 py-2.5" data-selected="true">
              <button type="button" role="checkbox" aria-checked="true" data-state="checked" aria-label="系统管理员（system_admin）" class="shrink-0 size-4 rounded-[4px] border border-input bg-elevated data-[state=checked]:border-primary data-[state=checked]:bg-primary data-[state=checked]:text-ink-inverse mt-0.5">
                <span class="indicator flex items-center justify-center leading-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
              </button>
              <span class="flex min-w-0 flex-1 flex-col gap-0.5">
                <span class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-0.5">
                  <span class="text-sm font-medium text-ink">系统管理员</span>
                  <span class="mono text-[11px] leading-4 text-ink-muted">system_admin</span>
                </span>
                <span class="text-xs leading-[18px] text-ink-body">全部权限，含安全策略、更新与备份</span>
              </span>
            </label>

            <label class="role-option flex items-start gap-2.5 px-3 py-2.5" data-selected="false">
              <button type="button" role="checkbox" aria-checked="false" data-state="unchecked" aria-label="普通管理员（admin）" class="shrink-0 size-4 rounded-[4px] border border-input bg-elevated data-[state=checked]:border-primary data-[state=checked]:bg-primary data-[state=checked]:text-ink-inverse mt-0.5">
                <span class="indicator flex items-center justify-center leading-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
              </button>
              <span class="flex min-w-0 flex-1 flex-col gap-0.5">
                <span class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-0.5">
                  <span class="text-sm font-medium text-ink">普通管理员</span>
                  <span class="mono text-[11px] leading-4 text-ink-muted">admin</span>
                </span>
                <span class="text-xs leading-[18px] text-ink-body">账号台账全量 + 审计查看，不含更新安装</span>
              </span>
            </label>

            <label class="role-option flex items-start gap-2.5 px-3 py-2.5" data-selected="false">
              <button type="button" role="checkbox" aria-checked="false" data-state="unchecked" aria-label="普通用户（standard_user）" class="shrink-0 size-4 rounded-[4px] border border-input bg-elevated data-[state=checked]:border-primary data-[state=checked]:bg-primary data-[state=checked]:text-ink-inverse mt-0.5">
                <span class="indicator flex items-center justify-center leading-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
              </button>
              <span class="flex min-w-0 flex-1 flex-col gap-0.5">
                <span class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-0.5">
                  <span class="text-sm font-medium text-ink">普通用户</span>
                  <span class="mono text-[11px] leading-4 text-ink-muted">standard_user</span>
                </span>
                <span class="text-xs leading-[18px] text-ink-body">仅本人可见范围的账号台账读写</span>
              </span>
            </label>

            <label class="role-option flex items-start gap-2.5 px-3 py-2.5" data-selected="false">
              <button type="button" role="checkbox" aria-checked="false" data-state="unchecked" aria-label="退休角色（retired）" class="shrink-0 size-4 rounded-[4px] border border-input bg-elevated data-[state=checked]:border-primary data-[state=checked]:bg-primary data-[state=checked]:text-ink-inverse mt-0.5">
                <span class="indicator flex items-center justify-center leading-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
              </button>
              <span class="flex min-w-0 flex-1 flex-col gap-0.5">
                <span class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-0.5">
                  <span class="text-sm font-medium text-ink">退休角色</span>
                  <span class="mono text-[11px] leading-4 text-ink-muted">retired</span>
                  <span class="badge badge-muted ml-auto shrink-0">停用 · 不授予权限</span>
                </span>
                <span class="text-xs leading-[18px] text-ink-body">历史遗留角色，已停止授予任何权限</span>
              </span>
            </label>
          </div>

          <p class="flex items-center gap-1.5 text-xs leading-[18px] text-danger" role="alert" id="alert" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            至少保留一个角色。
          </p>
        </div>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn-ghost">取消</button>
        <button type="button" class="btn btn-primary" id="save">保存角色</button>
      </div>
    </div>
  </div>

<script>
  const count = document.getElementById('count');
  const save = document.getElementById('save');
  const alert = document.getElementById('alert');
  function refresh() {
    const cards = [...document.querySelectorAll('.role-option')];
    const selected = cards.filter((c) => c.dataset.selected === 'true').length;
    count.innerHTML = '已选 <b class="font-semibold text-ink">' + selected + '</b> / ' + cards.length;
    save.disabled = selected === 0;
    alert.hidden = selected > 0;
  }
  document.querySelectorAll('.role-option').forEach((card) => {
    const box = card.querySelector('[role=checkbox]');
    box.addEventListener('click', () => {
      const on = box.getAttribute('aria-checked') !== 'true';
      box.setAttribute('aria-checked', String(on));
      box.dataset.state = on ? 'checked' : 'unchecked';
      card.dataset.selected = on ? 'true' : 'false';
      refresh();
    });
  });
  refresh();
</script>
</body>
</html>
