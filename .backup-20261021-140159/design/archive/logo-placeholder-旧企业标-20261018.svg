<!--
  PLACEHOLDER —— 临时占位标识，不是企业正式授权素材，不得对外称为官网原版。

  这是按设计参考图**重绘**的示意圆形标志：构图（绿色圆环 + 环内球体经纬线）来自参考视觉，
  不是从企业官网或品牌管理部门取得的原始矢量文件。

  正式交付前必须替换为企业提供的授权 Logo（优先 SVG，其次透明 PNG）：
    1. 把授权文件放到 src/assets/brand/logo.svg
    2. 修改 src/components/ui/BrandLogo.tsx 里唯一一处 import
  页面布局、组件与样式都不需要任何改动。

  环字使用「内蒙古电力（集团）有限责任公司」。参考图上圆环文字是
  「国家电网公司 / STATE GRID CORPORATION OF CHINA」，那是另一家企业的注册标识，此处不予复制。

  保持原始比例、颜色与安全留白：不要拉伸、改色、加玻璃滤镜，也不要把它和文字标识合成一张位图。
-->
