<!doctype html>
<html lang="zh-CN" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AO 提示条探针</title>
<link rel="stylesheet" href="../dist/assets/global-DI8BdIus.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(900px 600px at 15% 10%, rgba(124, 92, 255, 0.16), transparent 60%),
      radial-gradient(700px 500px at 90% 90%, rgba(56, 189, 248, 0.12), transparent 60%),
      var(--t-bg);
    color: var(--t-text);
    font-family: var(--font-sans);
  }
  /* 提示条背后放一块有内容的区域，用来同时看玻璃面的模糊与投影压住的是什么 */
  .behind {
    position: fixed; inset: auto 0 0 0; height: 260px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px;
  }
  .behind div {
    border: 1px solid var(--t-border); border-radius: var(--radius-md);
    background: var(--t-surface); padding: 12px; font-size: 13px; color: var(--t-text-body);
  }
  .stage {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; flex-direction: column; gap: 8px; width: 320px;
  }
  .stage > ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .stage li { width: 320px; }
</style>
</head>
<body>
  <div class="behind">
    <div>上一行 · 账号台账</div><div>用户名 zhou****</div><div>密码已托管</div><div>刚刚更新</div>
    <div>第 1 页</div><div>共 48 条数据</div><div>本系统合计 12 条</div><div>只看关注</div>
  </div>

  <div class="stage">
    <ol data-sonner-toaster>
      <li class="toast surface-glass toast-tone-success" data-sonner-toast tabindex="0">
        <button class="toast-dismiss" data-close-button aria-label="关闭提示">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div data-icon>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div data-content><div data-title>用户名已复制到剪贴板</div></div>
      </li>
      <li class="toast surface-glass toast-tone-warning" data-sonner-toast tabindex="0">
        <button class="toast-dismiss" data-close-button aria-label="关闭提示">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div data-icon>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </div>
        <div data-content><div data-title>这条连接串里没有可解析的主机，已按原样保存</div></div>
      </li>
      <li class="toast surface-glass toast-tone-info" data-sonner-toast tabindex="0">
        <button class="toast-dismiss" data-close-button aria-label="关闭提示">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div data-icon>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </div>
        <div data-content><div data-title>已导出到 /Users/zhouhongbo/Documents/export-20261021-093000.xlsx</div></div>
      </li>
    </ol>
  </div>
</body>
</html>
